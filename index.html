    let activeCat = 'ALL';
    const grid = document.getElementById('cards-grid');
    const searchEl = document.getElementById('search-input');
    const sortEl = document.getElementById('sort-select');
    const statusEl = document.getElementById('status-text');

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function render() {
      const q = searchEl.value.trim().toLowerCase();
      const sortBy = sortEl.value;
      let list = ARTICLES.filter(a => {
        if (activeCat !== 'ALL' && a.category !== activeCat) return false;
        if (!q) return true;
        return (a.title_zh + ' ' + a.title_ja + ' ' + a.summary_zh + ' ' + a.category + ' ' + a.id).toLowerCase().includes(q);
      });

      list.sort((a, b) => {
        if (sortBy === 'updated') return (b.updated || b.published).localeCompare(a.updated || a.published);
        if (sortBy === 'published') return (b.published || '').localeCompare(a.published || '');
        if (sortBy === 'id') return Number(b.id) - Number(a.id);
        return (a.cat_rank - b.cat_rank) || (b.updated || '').localeCompare(a.updated || '');
      });

      statusEl.textContent = `当前显示 ${list.length} / ${ARTICLES.length} 篇文章`;
      if (!list.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px 16px;color:var(--muted);">没有找到匹配的文章，试试换个关键词？</div>';
        return;
      }

      grid.innerHTML = list.map(a => {
        const thumb = a.thumb
          ? `<img class="post-thumb" src="./${esc(a.thumb)}" alt="${esc(a.title_zh)}" loading="lazy" />`
          : `<div class="post-thumb-placeholder">IIDX #${esc(a.id)}</div>`;
        const dateStr = a.updated && a.updated !== a.published ? `更新 ${a.updated}` : `发布 ${a.published}`;
        const extra = [];
        if (a.imgs) extra.push(`🖼️ ${a.imgs}`);
        if (a.comments) extra.push(`💬 ${a.comments}`);
        return `<a class="post-card" href="./articles/${esc(a.id)}.html">
          <div class="post-thumb-wrap">${thumb}</div>
          <div class="post-body">
            <div class="post-badges">
              <span class="cat-badge">${esc(a.category)}</span>
              <span class="post-id">#${esc(a.id)}</span>
            </div>
            <div class="post-title">${esc(a.title_zh)}</div>
            <div class="post-summary">${esc(a.summary_zh)}</div>
            <div class="post-foot">
              <span>${esc(dateStr)}</span>
              <span>${extra.join(' · ')}</span>
            </div>
          </div>
        </a>`;
      }).join('');
    }

    document.getElementById('cat-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.cat-tab');
      if (!btn) return;
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      render();
    });
    searchEl.addEventListener('input', render);
    sortEl.addEventListener('change', render);
    render();
  </script>
</body>
</html>
